name: Continuous Integration (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Dependencies
        run: pnpm install

      - name: Build TypeScript packages
        run: pnpm --filter @cansche/platform --filter @cansche/repositories --filter @cansche/application build

      - name: Build web application
        run: pnpm --filter @cansche/web build

      - name: Check desktop Rust project
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

      - name: Run Test Suite
        run: pnpm test
