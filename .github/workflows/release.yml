name: Desktop Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
          - platform: 'ubuntu-22.04'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev file

      - name: Install Node dependencies
        run: pnpm install

      - name: Validate version, changelog and updater configuration
        run: node scripts/release/validate.mjs ${{ github.ref_name }}

      - name: Extract & Validate Release Notes from CHANGELOG.md
        id: changelog
        run: node scripts/changelog/extract.mjs ${{ github.ref_name }}

      - name: Generate Valid PNG Icons
        run: node apps/desktop/scripts/generate-valid-pngs.mjs

      - name: Build Tauri Desktop App & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Cansche ${{ github.ref_name }} — Desktop Release'
          releaseBody: ${{ steps.changelog.outputs.markdown }}
          releaseDraft: false
          prerelease: false
