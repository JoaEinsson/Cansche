name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag existente que deve ser publicada'
        required: true
        default: 'v1.2.0'
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
          - platform: 'ubuntu-22.04'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev file

      - name: Install Node dependencies
        run: pnpm install

      - name: Validate version, changelog and updater configuration
        run: node scripts/release/validate.mjs ${{ env.RELEASE_TAG }}

      - name: Extract & Validate Release Notes from CHANGELOG.md
        id: changelog
        run: node scripts/changelog/extract.mjs ${{ env.RELEASE_TAG }}

      - name: Generate Valid PNG Icons
        run: node apps/desktop/scripts/generate-valid-pngs.mjs

      - name: Prepare updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node -e "const fs=require('node:fs'); const os=require('node:os'); const path=require('node:path'); const key=process.env.TAURI_SIGNING_PRIVATE_KEY||''; if(!key.trim()){console.error('TAURI_SIGNING_PRIVATE_KEY is empty or unavailable'); process.exit(1)} const keyPath=path.join(process.env.RUNNER_TEMP,'cansche-tauri-signing.key'); fs.writeFileSync(keyPath,key,{encoding:'utf8'}); fs.appendFileSync(process.env.GITHUB_ENV,'TAURI_SIGNING_PRIVATE_KEY='+keyPath+os.EOL); console.log('Updater signing key received: '+key.length+' characters across '+key.split(String.fromCharCode(10)).length+' lines.')"

      - name: Build Tauri Desktop App & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Cansche ${{ env.RELEASE_TAG }} — Desktop Release'
          releaseBody: ${{ steps.changelog.outputs.markdown }}
          releaseDraft: false
          prerelease: false

      - name: Remove temporary updater signing key
        if: always()
        run: node -e "const fs=require('node:fs'); const path=require('node:path'); fs.rmSync(path.join(process.env.RUNNER_TEMP,'cansche-tauri-signing.key'),{force:true})"
